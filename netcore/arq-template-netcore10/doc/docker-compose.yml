
# docker-compose down
# docker-compose up -d --build
# docker-compose down -v 
# docker-compose up --build

version: "3.9"

services:

  sqlserver:
    image: mcr.microsoft.com/azure-sql-edge:latest
    cap_add: [ 'SYS_PTRACE' ]
    hostname: mssql
    container_name: sqlserver
    restart: always
    expose:
      - 1433
    ports:
      - 1433:1433
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=GFM@d19m08a2026
      - MSSQL_PID=Developer
      - MSSQL_TCP_PORT=1433
    networks:
      - app-backend
    volumes:
      - sql_data:/var/opt/mssql

  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: GFM@d19m08a2026
      MYSQL_USER: admin
      MYSQL_PASSWORD: GFM@d19m08a2026
      MYSQL_DATABASE: Teste
    restart: always
    expose:
      - 3306
    ports:
      - "3306:3306"
    networks:
      - app-backend

  postgres:
    image: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: GFM@d19m08a2026
      POSTGRES_DB: admin
    restart: always
    expose:
      - 5432
    ports:
      - "5432:5432"
    networks:
      - app-backend

  redis:
    image: redis:latest
    container_name: redis
    command: redis-server --requirepass GFM@d19m08a2026
    restart: always
    expose:
      - 6379
    ports:
      - 6379:6379
    networks:
      - app-backend
    volumes:
      - redis_data:/var/opt/redis

  mongoserver:
    image: mongo:latest
    container_name: mongoserver
    restart: always
    expose:
      - 27017
    ports:
      - 27017:27017
    networks:
      - app-backend
    volumes:
      - mongoserver_data:/var/opt/mongoserver

  # http://localhost:15672/#/
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    restart: always
    ports:
      - 5672:5672
      - 15672:15672
    volumes:
      - ~/.docker-conf/rabbitmq/data/:/var/lib/rabbitmq/
      - ~/.docker-conf/rabbitmq/log/:/var/log/rabbitmq
    networks:
      - app-backend

  zookeeper:
    image: bitnamilegacy/zookeeper:3.9.3-debian-12-r22
    restart: always
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/bitnami
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    networks:
      - app-backend


  # Kafka
  # Porta interna Docker: kafka1:9092
  # Porta externa máquina: localhost:29092
  # http://localhost:9100
  kafka1:
    image: bitnamilegacy/kafka:3.6
    restart: always
    volumes:
      - kafka_data1:/bitnami
    environment:
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_CFG_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092

      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka1:9092,EXTERNAL://localhost:29092

      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"

      ALLOW_PLAINTEXT_LISTENER: "yes"

    ports:
      - "9092:9092"
      - "29092:29092"

    depends_on:
      - zookeeper

    networks:
      - app-backend


  # Kafka UI
  # http://localhost:9100
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    restart: always

    ports:
      - "9100:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

    depends_on:
      - kafka1

    networks:
      - app-backend

networks:
  app-backend:

volumes:
  sql_data:
  redis_data:
  mongoserver_data:
  zookeeper_data:
  kafka_data1: