name: meu-projeto

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: meu-projeto-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQLSERVER_SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$MSSQL_SA_PASSWORD -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  sqlserver-init:
    image: mcr.microsoft.com/mssql-tools
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      SQLSERVER_SA_PASSWORD: "${SQLSERVER_SA_PASSWORD}"
    volumes:
      - ./docker/sql:/scripts
    entrypoint:
      - /bin/bash
      - -c
      - |
        /opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P "$$SQLSERVER_SA_PASSWORD" -Q "IF DB_ID('MeuProjeto_Dev') IS NULL CREATE DATABASE [MeuProjeto_Dev];"
        /opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P "$$SQLSERVER_SA_PASSWORD" -Q "IF DB_ID('MeuProjeto_Test') IS NULL CREATE DATABASE [MeuProjeto_Test];"

volumes:
  sqlserver_data:
